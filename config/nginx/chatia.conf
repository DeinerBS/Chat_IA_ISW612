# HTTP: todo se redirige a HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/ssl/certs/chatia.crt;
    ssl_certificate_key /etc/ssl/private/chatia.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Límites de tamaño y tiempo de las peticiones
    client_max_body_size  16k;
    client_body_timeout   10s;
    client_header_timeout 10s;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; form-action 'self'" always;

    access_log /var/log/nginx/chatia_access.log;
    error_log  /var/log/nginx/chatia_error.log warn;

    location = /favicon.ico { access_log off; return 204; }

    # Login: límite estricto contra fuerza bruta
    location = /login {
        limit_req zone=login burst=5 nodelay;
        include snippets/chatia-php.conf;
        fastcgi_read_timeout 15s;
    }

    # Chat: consulta a Ollama, más tiempo de respuesta permitido
    location = /api/chat {
        limit_req zone=chat burst=5 nodelay;
        include snippets/chatia-php.conf;
        fastcgi_read_timeout 120s;
    }

    # Todo lo demás pasa por el controlador frontal de la app
    location / {
        limit_req zone=general burst=20 nodelay;
        include snippets/chatia-php.conf;
        fastcgi_read_timeout 30s;
    }
}
