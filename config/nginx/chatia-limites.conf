# Contexto http: zonas de rate limiting por IP de cliente
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=chat:10m    rate=20r/m;

# En /login solo cuentan los POST (intentos de contraseña); clave vacía = sin límite
map $request_method $clave_login {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $clave_login zone=login:10m rate=10r/m;

limit_req_status 429;

# No mostrar la versión de Nginx
server_tokens off;
