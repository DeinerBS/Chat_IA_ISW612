<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#ffffff"/>

  <!-- Título -->
  <text x="40" y="48" font-size="26" font-weight="bold" fill="#0f172a">Arquitectura · Chat con IA propia (Opción A)</text>
  <text x="40" y="76" font-size="15" fill="#475569">ISW-612 · Trabajo 2 · 1 VM, 4 servicios, 1 disco de datos</text>

  <!-- Anfitrión -->
  <rect x="30" y="120" width="250" height="560" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="155" y="150" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Equipo anfitrión</text>
  <text x="155" y="170" font-size="12.5" fill="#475569" text-anchor="middle">red Solo anfitrión 192.168.56.0/24</text>

  <rect x="50" y="215" width="190" height="90" rx="10" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <text x="145" y="250" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Navegador</text>
  <text x="145" y="272" font-size="12.5" fill="#475569" text-anchor="middle">empleado / administrador</text>
  <text x="145" y="290" font-size="12.5" fill="#475569" text-anchor="middle">de la app</text>

  <rect x="50" y="475" width="190" height="80" rx="10" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <text x="145" y="508" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Administrador</text>
  <text x="145" y="530" font-size="12.5" fill="#475569" text-anchor="middle">cliente SSH con llave</text>

  <!-- VM -->
  <rect x="330" y="105" width="1045" height="770" rx="16" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>
  <text x="352" y="135" font-size="17" font-weight="bold" fill="#0f172a">VM · Ubuntu Server 24.04 LTS · VirtualBox</text>
  <text x="352" y="156" font-size="12.5" fill="#475569">4–8 GB RAM · 2–4 vCPU · enp0s3 NAT (salida a internet) · enp0s8 Solo anfitrión 192.168.56.10</text>

  <!-- Firewall -->
  <rect x="350" y="172" width="1005" height="40" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="852" y="198" font-size="13.5" fill="#78350f" text-anchor="middle">ufw: entrada denegada por defecto · solo 22/tcp, 80/tcp, 443/tcp · fail2ban vigila SSH</text>

  <!-- Nginx -->
  <rect x="370" y="245" width="225" height="150" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/>
  <text x="482" y="275" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Nginx</text>
  <text x="482" y="297" font-size="12.5" fill="#334155" text-anchor="middle">proxy inverso · :80 y :443</text>
  <text x="482" y="317" font-size="12.5" fill="#334155" text-anchor="middle">TLS 1.2+ (autofirmado)</text>
  <text x="482" y="337" font-size="12.5" fill="#334155" text-anchor="middle">cabeceras de seguridad</text>
  <text x="482" y="357" font-size="12.5" fill="#334155" text-anchor="middle">rate limiting (429)</text>
  <text x="482" y="380" font-size="11.5" fill="#64748b" text-anchor="middle">usuario: www-data</text>

  <!-- App PHP -->
  <rect x="680" y="245" width="250" height="150" rx="10" fill="#fff" stroke="#475569" stroke-width="2"/>
  <text x="805" y="275" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">App web PHP</text>
  <text x="805" y="297" font-size="12.5" fill="#334155" text-anchor="middle">PHP-FPM 8.3 · pool propio</text>
  <text x="805" y="317" font-size="12.5" fill="#334155" text-anchor="middle">login, roles, chat, historial</text>
  <text x="805" y="337" font-size="12.5" fill="#334155" text-anchor="middle">panel admin · bcrypt</text>
  <text x="805" y="357" font-size="12.5" fill="#334155" text-anchor="middle">sesiones con expiración</text>
  <text x="805" y="380" font-size="11.5" fill="#64748b" text-anchor="middle">usuario: chatia (sin shell)</text>

  <!-- Ollama -->
  <rect x="1030" y="245" width="315" height="150" rx="10" fill="#fff" stroke="#475569" stroke-width="2"/>
  <text x="1187" y="275" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Ollama</text>
  <text x="1187" y="297" font-size="12.5" fill="#334155" text-anchor="middle">servicio systemd · arranca solo</text>
  <text x="1187" y="317" font-size="12.5" fill="#334155" text-anchor="middle">escucha solo 127.0.0.1:11434</text>
  <text x="1187" y="337" font-size="12.5" fill="#334155" text-anchor="middle">modelo 1B–3B en CPU</text>
  <text x="1187" y="357" font-size="12.5" fill="#334155" text-anchor="middle">(3 modelos a comparar)</text>
  <text x="1187" y="380" font-size="11.5" fill="#64748b" text-anchor="middle">usuario: ollama</text>

  <!-- MariaDB -->
  <rect x="680" y="465" width="250" height="110" rx="10" fill="#fff" stroke="#475569" stroke-width="2"/>
  <text x="805" y="495" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">MariaDB</text>
  <text x="805" y="517" font-size="12.5" fill="#334155" text-anchor="middle">usuarios, roles, historial,</text>
  <text x="805" y="537" font-size="12.5" fill="#334155" text-anchor="middle">contador de uso</text>
  <text x="805" y="560" font-size="11.5" fill="#64748b" text-anchor="middle">solo 127.0.0.1:3306 · usuario: mysql</text>

  <!-- sshd -->
  <rect x="370" y="465" width="225" height="110" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/>
  <text x="482" y="495" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">OpenSSH</text>
  <text x="482" y="517" font-size="12.5" fill="#334155" text-anchor="middle">:22 · solo llaves</text>
  <text x="482" y="537" font-size="12.5" fill="#334155" text-anchor="middle">sin acceso de root</text>
  <text x="482" y="560" font-size="11.5" fill="#64748b" text-anchor="middle">administración</text>

  <!-- Disco -->
  <rect x="350" y="630" width="1005" height="225" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <text x="372" y="808" font-size="16" font-weight="bold" fill="#064e3b">Disco de datos · 20 GB · /dev/sdc1 · ext4 · montado por UUID en /srv/ia (fstab)</text>
  <text x="372" y="832" font-size="12.5" fill="#065f46">El sistema operativo queda en el disco 1; los modelos, la base de datos y los respaldos viven en este disco</text>

  <rect x="372" y="648" width="290" height="125" rx="8" fill="#fff" stroke="#047857" stroke-width="1.5"/>
  <text x="522" y="680" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">/srv/ia/respaldos</text>
  <text x="522" y="703" font-size="12.5" fill="#334155" text-anchor="middle">volcado de BD + configuraciones</text>
  <text x="522" y="723" font-size="12.5" fill="#334155" text-anchor="middle">(script de respaldo y restauración)</text>
  <text x="522" y="757" font-size="11.5" fill="#64748b" text-anchor="middle">root:root · 700</text>

  <rect x="680" y="648" width="250" height="125" rx="8" fill="#fff" stroke="#047857" stroke-width="1.5"/>
  <text x="805" y="680" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">/srv/ia/mariadb</text>
  <text x="805" y="703" font-size="12.5" fill="#334155" text-anchor="middle">datadir de MariaDB</text>
  <text x="805" y="757" font-size="11.5" fill="#64748b" text-anchor="middle">mysql:mysql · 750</text>

  <rect x="1030" y="648" width="315" height="125" rx="8" fill="#fff" stroke="#047857" stroke-width="2"/>
  <text x="1187" y="680" font-size="14.5" font-weight="bold" fill="#0f172a" text-anchor="middle">/srv/ia/ollama/models</text>
  <text x="1187" y="703" font-size="12.5" fill="#334155" text-anchor="middle">OLLAMA_MODELS (override systemd)</text>
  <text x="1187" y="757" font-size="11.5" fill="#64748b" text-anchor="middle">ollama:ollama · 750</text>

  <!-- Flechas externas (expuestas) -->
  <line x1="240" y1="275" x2="366" y2="275" stroke="#15803d" stroke-width="2.5" marker-end="url(#flv)"/>
  <text x="288" y="252" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">HTTPS :443</text>
  <text x="288" y="300" font-size="11.5" fill="#15803d" text-anchor="middle">(:80 → 301)</text>

  <line x1="240" y1="515" x2="366" y2="515" stroke="#15803d" stroke-width="2.5" marker-end="url(#flv)"/>
  <text x="288" y="500" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">SSH :22</text>

  <!-- Flechas internas -->
  <line x1="595" y1="320" x2="676" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/>
  <text x="637" y="300" font-size="11.5" fill="#334155" text-anchor="middle">FastCGI</text>
  <text x="637" y="342" font-size="11.5" fill="#334155" text-anchor="middle">socket unix</text>

  <line x1="930" y1="320" x2="1026" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/>
  <text x="978" y="300" font-size="11.5" fill="#334155" text-anchor="middle">HTTP local</text>
  <text x="978" y="342" font-size="11.5" fill="#334155" text-anchor="middle">/api/chat</text>

  <line x1="805" y1="395" x2="805" y2="461" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/>
  <text x="815" y="433" font-size="11.5" fill="#334155">SQL (PDO) local</text>

  <line x1="805" y1="575" x2="805" y2="644" stroke="#047857" stroke-width="2" marker-end="url(#fl)"/>
  <line x1="1187" y1="395" x2="1187" y2="644" stroke="#047857" stroke-width="2" marker-end="url(#fl)"/>
  <text x="1197" y="560" font-size="11.5" fill="#047857">lee/escribe modelos</text>

  <!-- Bloqueado -->
  <text x="1175" y="455" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="end">✗ 11434 y 3306 no se exponen</text>
  <text x="1175" y="473" font-size="11.5" fill="#b91c1c" text-anchor="end">(curl desde el anfitrión debe fallar)</text>

  <!-- Leyenda -->
  <g font-size="12" fill="#334155">
    <rect x="30" y="700" width="250" height="140" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="45" y="728" font-weight="bold" fill="#0f172a">Leyenda</text>
    <line x1="45" y1="750" x2="75" y2="750" stroke="#15803d" stroke-width="2.5"/>
    <text x="85" y="754">puerto expuesto (22/80/443)</text>
    <line x1="45" y1="776" x2="75" y2="776" stroke="#334155" stroke-width="2"/>
    <text x="85" y="780">tráfico solo interno</text>
    <text x="45" y="806" fill="#64748b" font-size="11.5">servicios con usuarios sin</text>
    <text x="45" y="822" fill="#64748b" font-size="11.5">privilegios, bajo systemd</text>
  </g>
</svg>
